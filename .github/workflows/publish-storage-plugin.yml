name: d2e-storage publish plugin

on:
  workflow_dispatch:
    inputs:
      GIT_REPO_FULL_NAME:
        description: Select RepoName
        required: false
        type: choice
        options:
          - data2evidence/d2e-storage
      GIT_BRANCH_NAME:
        default: develop
        description: Enter BranchName / ReleaseTagName
        required: true
        type: string
      tag:
        description: Enter tag for release
        required: true
        type: string
      release:
        description: Enter name for github release
        required: true
        type: string
      artifacttype:
        type: choice
        required: true
        default: "OSS-develop"
        options:
          - "OSS-develop"
          - "OSS-release"
          - "Project"
      prerelease:
        type: boolean
        default: true
        required: true
      overwrite:
        type: boolean
        default: true
        required: true
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches:
      - develop
      - release/**
      - hengxian-jiang/npm_pkg_pub
      - release/v1.14.5

env:
  GIT_BRANCH_NAME: ${{ github.event.inputs.GIT_BRANCH_NAME || github.head_ref || github.ref_name }}
  GIT_REPO_FULL_NAME: ${{ github.event.inputs.GIT_REPO_FULL_NAME || github.event.pull_request.head.repo.full_name || github.event.repository.full_name }}
  NPM_ARTIFACT_TYPE: ${{ github.event.inputs.artifacttype || 'OSS-develop'}}

jobs:
  check_file_changes:
    runs-on: ubuntu-latest
    if: |
      (github.ref_name == 'develop' || 
      startsWith(github.ref_name, 'release/') || 
      github.event_name == 'workflow_dispatch') || 
      github.ref_name == 'hengxian-jiang/npm_pkg_pub' || 
      ( github.event_name == 'pull_request' && !github.event.pull_request.draft )
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          initial-fetch-depth: 1
          filters: |
            changed:
              - "src/**"
              - "package.json"
              - "package-lock.json"
              - "tsconfig.json"
              - "build.js"
              - ".github/workflows/publish-storage-plugin.yml"

  build_and_publish:
    runs-on: ubuntu-24.04
    needs: [check_file_changes]
    if: (github.ref_name == 'develop' || startsWith(github.ref_name, 'release/') || github.ref_name == 'hengxian-jiang/npm_pkg_pub' || github.ref_name == 'release/v1.14.5' || github.event_name == 'workflow_dispatch') || ( github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.check_file_changes.outputs.changed == 'true' )
    strategy:
      fail-fast: false
      matrix:
        include:
          - PKGPATH: ./
            DESTPATH: /usr/src/data/plugins/node_modules/@data2evidence/storage
            NPM: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GIT_BRANCH_NAME }}
          repository: ${{ env.GIT_REPO_FULL_NAME }}
          submodules: recursive
          fetch-depth: 0

      - name: Use Node.js (GH registry baseline)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@data2evidence"

      - name: Install Deno and preinstall Trex deps (if DESTPATH)
        if: ${{ matrix.DESTPATH }}
        run: |
          npm install -g deno@2.1.13
          export PATH="$(npm root -g)/deno/bin:$PATH"
          denover="$(deno --version | grep deno | awk '{print $2}')"
          echo "Deno version: $denover"
          denover_expected="2.1.13"
          if [ "$denover" != "$denover_expected" ]; then
            echo "Error: Deno version is $denover, expected $denover_expected"
            exit 1
          fi
          cd ${{ matrix.PKGPATH }}
          echo "@data2evidence:registry=https://npm.pkg.github.com" >> ./.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ./.npmrc
          deno install --allow-scripts
          node ./install-deno-deps.js ${{ matrix.PKGPATH }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RELEASE_VERSION='${{ github.event.inputs.tag }}'
            jq --arg v "$RELEASE_VERSION" '.version=$v' package.json > tmppkg && mv tmppkg package.json
          else
            jq --arg v "-$(date +%s)-${GITHUB_SHA}" '.version+=$v' package.json > tmppkg && mv tmppkg package.json
          fi

      - name: Build
        run: npm run build

      - name: Ensure package is publishable
        run: jq '.private=false' package.json > tmppkg && mv tmppkg package.json

      - name: Prepare DEST (Trex layout) and build with Trex
        if: ${{ matrix.DESTPATH }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo mkdir -p ${{ matrix.DESTPATH }}
          sudo chown runner:docker ${{ matrix.DESTPATH }}
          cd ${{ matrix.DESTPATH }}
          # Ensure workspace-local import map so Trex/Deno sees config inside workspace
          # Write a workspace-local deno.json without a workspace key
          if [ -f node_modules/@data2evidence/storage/deno.json ]; then
            jq 'del(.workspace)' node_modules/@data2evidence/storage/deno.json > deno.json || cp node_modules/@data2evidence/storage/deno.json deno.json
          fi
          [ -f import_map.json ] || cp deno.json import_map.json
          export TREX_DOCKER_TAG=sha256:468f1fa411b288f8ebac842dc0982bb7b8cb2d5eeb8dc25a494b734fcacfac42
          echo "Using TREX_DOCKER_TAG=$TREX_DOCKER_TAG"
          echo "@data2evidence:registry=https://npm.pkg.github.com" >> ./.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ./.npmrc
          npm i @data2evidence/trex
          npm run trex_build || true

      - name: Select publish registry - OSS Develop
        if: env.NPM_ARTIFACT_TYPE == 'OSS-develop'
        run: echo "NPM_PUBLISH_REGISTRY=https://pkgs.dev.azure.com/data2evidence/d2e/_packaging/d2e/npm/registry/" >> $GITHUB_ENV

      - name: Select publish registry - OSS Release
        if: env.NPM_ARTIFACT_TYPE == 'OSS-release'
        run: echo "NPM_PUBLISH_REGISTRY=https://pkgs.dev.azure.com/data2evidence/d2e/_packaging/stable/npm/registry/" >> $GITHUB_ENV

      - name: Select publish registry - Project
        if: env.NPM_ARTIFACT_TYPE == 'Project'
        run: echo "NPM_PUBLISH_REGISTRY=https://pkgs.dev.azure.com/data2evidence/d2e/_packaging/ms/npm/registry/" >> $GITHUB_ENV

      - name: Configure npm auth for selected registry
        env:
          NPM_TOKEN: ${{ secrets.NPM_PROJECT_TOKEN }}
        run: |
          REG_URL="${NPM_PUBLISH_REGISTRY%/}"
          REG_HOST="${REG_URL#https://}"
          echo "//${REG_HOST}/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

      - name: Publish
        env:
          SHOULD_PUBLISH: ${{ github.ref_name == 'develop' || startsWith(github.ref_name, 'release/') || github.event_name == 'workflow_dispatch' || github.ref_name == 'hengxian-jiang/npm_pkg_pub' || github.ref_name == 'release/v1.14.5' }}
          NPM_PROJECT_TOKEN: ${{ secrets.NPM_PROJECT_TOKEN }}
        run: |
          cd ${{ matrix.PKGPATH }}
          echo "@data2evidence:registry=${NPM_PUBLISH_REGISTRY}" > ./.npmrc
          REG_URL="${NPM_PUBLISH_REGISTRY%/}"
          REG_HOST="${REG_URL#https://}"
          echo "//${REG_HOST}/:_authToken=${NPM_PROJECT_TOKEN}" >> ./.npmrc
          if [[ "${SHOULD_PUBLISH}" == "true" ]]; then
            ${{ matrix.NPM || 'npm' }} publish
          else
            ${{ matrix.NPM || 'npm' }} pack
          fi